        dateRangeElement.textContent = data.page_context.date_range[0].date_range_label;

        // Generate the income statement table
        const tableElement = document.getElementById('income-statement');
        
        // Function to format currency values
        function formatCurrency(value) {
            return value;
        }

        // Function to add a row to the table
        function addRow(name, value, className = '') {
            const row = document.createElement('tr');
            if (className) row.className = className;
            
            const nameCell = document.createElement('td');
            nameCell.textContent = name;
            row.appendChild(nameCell);
            
            const valueCell = document.createElement('td');
            valueCell.textContent = value;
            if (value.startsWith('-')) {
                valueCell.className = 'negative';
            }
            row.appendChild(valueCell);
            
            tableElement.appendChild(row);
        }
        
        // Add table headers
        const headerRow = document.createElement('tr');
        const headerItem = document.createElement('th');
        headerItem.textContent = 'Item';
        headerRow.appendChild(headerItem);
        
        const headerAmount = document.createElement('th');
        headerAmount.textContent = 'Amount (₹)';
        headerRow.appendChild(headerAmount);
        
        tableElement.appendChild(headerRow);
        
        // Revenue section
        addRow('Revenue', '', 'section-header');
        
        // Get operating income accounts
        const operatingIncome = data.profit_and_loss.accounts.find(
            account => account.node_name === 'operating_income'
        );
        
        if (operatingIncome && operatingIncome.accounts) {
            operatingIncome.accounts.forEach(account => {
                addRow(account.name, account.values[0].total_formatted, 'indent-1');
            });
        }
        
        // Total Revenue
        addRow('Total Revenue', operatingIncome.values[0].total_sub_account_formatted, 'total-row');
        
        // Cost of Goods Sold
        const cogs = data.profit_and_loss.accounts.find(
            account => account.node_name === 'cost_of_goods_sold'
        );
        
        if (cogs) {
            addRow('Cost of Goods Sold', cogs.values[0].total_sub_account_formatted, 'section-header');
        }
        
        // Gross Profit
        const grossProfit = data.profit_and_loss.accounts.find(
            account => account.node_name === 'gross_profit'
        );
        
        if (grossProfit) {
            addRow('Gross Profit', grossProfit.values[0].total_sub_account_formatted, 'total-row');
        }
        
        // Operating Expenses
        const operatingExpense = data.profit_and_loss.accounts.find(
            account => account.node_name === 'operating_expense'
        );
        
        if (operatingExpense) {
            addRow('Operating Expenses', '', 'section-header');

        );
        
        if (operatingProfit) {
            addRow('Operating Profit', operatingProfit.values[0].total_sub_account_formatted, 'total-row');
        }
        
        // Non-Operating Items
        const nonOperatingIncome = data.profit_and_loss.accounts.find(
            account => account.node_name === 'non_operating_income'
        );
        
        const nonOperatingExpense = data.profit_and_loss.accounts.find(
            account => account.node_name === 'non_operating_expense'
        );
        
        if (nonOperatingIncome || nonOperatingExpense) {
            addRow('Non-Operating Items', '', 'section-header');
            
            if (nonOperatingIncome) {
                addRow('Non-Operating Income', nonOperatingIncome.values[0].total_sub_account_formatted, 'indent-1');
            }
            
            if (nonOperatingExpense) {
                addRow('Non-Operating Expense', nonOperatingExpense.values[0].total_sub_account_formatted, 'indent-1');
            }
        }
        
        // Net Profit/Loss
        const netProfitLoss = data.profit_and_loss.accounts.find(
            account => account.node_name === 'net_profit_loss'
        );
        
        if (netProfitLoss) {
            addRow('Net Profit/Loss', netProfitLoss.values[0].total_sub_account_formatted, 'grand-total');
        }
    </script>
</body>
</html>
